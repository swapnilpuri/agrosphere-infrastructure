name: Infrastructure validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/validate.py
      - run: docker compose --env-file .env.example --profile apps --profile iot config --quiet
      - run: bash -n postgres/init.sh
      - run: docker build -t agrosphere-otel-collector:0.2.0 otel
      - run: docker build -t agrosphere-jaeger:0.2.0 jaeger
